spring.application.name=joinlist

# Database (set these in the environment when deploying)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/joinlist}
spring.datasource.username=${DATABASE_USERNAME:joinlist}
spring.datasource.password=${DATABASE_PASSWORD:joinlist}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}

# Behind Render's proxy: read the real client IP from X-Forwarded-For (used by the rate limiter)
server.forward-headers-strategy=framework

# Health check at /api/health
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health

# Joinlist settings
# Secret used to sign login tokens and QR codes. Must be at least 32 characters. Change it in production.
joinlist.secret=${JOINLIST_SECRET:dev-only-secret-change-me-0123456789abcdef}
joinlist.token-days=7
joinlist.cors-origins=${CORS_ORIGINS:http://localhost:5173}
# How seats are taken: "atomic" (conditional UPDATE) or "pessimistic" (SELECT ... FOR UPDATE)
joinlist.seat-strategy=${SEAT_STRATEGY:atomic}
joinlist.cancel-cutoff-hours=2
joinlist.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Brevo email. With no API key, emails are only written to the log.
joinlist.brevo.api-key=${BREVO_API_KEY:}
joinlist.brevo.sender-email=${BREVO_SENDER_EMAIL:}
joinlist.brevo.sender-name=Joinlist
joinlist.app-url=${APP_URL:http://localhost:5173}
